<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0B95C"/>
      <stop offset="100%" stop-color="#B8862B"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="#0A0A0A"/>

  <!-- Inner Border -->
  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="14"
    fill="none"
    stroke="rgba(255,255,255,.08)"
    stroke-width="1"/>

  <!-- Star -->
  <path
    filter="url(#shadow)"
    fill="url(#gold)"
    d="
      M32 10
      L37.8 22.3
      L51.2 23.8
      L41.3 32.8
      L44 46
      L32 39.2
      L20 46
      L22.7 32.8
      L12.8 23.8
      L26.2 22.3
      Z"/>

  <!-- Letter -->
  <text
    x="32"
    y="38"
    text-anchor="middle"
    font-size="18"
    font-family="Inter, Arial, sans-serif"
    font-weight="800"
    fill="#FFFFFF"
    letter-spacing="-0.5">
    S
  </text>
</svg>
